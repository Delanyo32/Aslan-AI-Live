<!doctype html>
<!-- Scratch viewer for the Reality Ledger (PLAN Phase 8 — throwaway by
     agreement; real terminal integration comes later). Served from /reality.html,
     reads same-origin /api/reality/{cik}. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reality Ledger — scratch viewer</title>
<style>
  body { font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background:#0d1117; color:#e6edf3; margin:2rem; }
  h1 { font-size:1.2rem } h2 { font-size:1rem; margin-top:2rem; border-bottom:1px solid #30363d; padding-bottom:.3rem }
  input, button { font:inherit; background:#161b22; color:inherit; border:1px solid #30363d; padding:.4rem .6rem; border-radius:6px }
  button { cursor:pointer } button:hover { border-color:#8b949e }
  table { border-collapse:collapse; width:100%; margin-top:.5rem; font-size:13px }
  th, td { text-align:right; padding:.25rem .6rem; border-bottom:1px solid #21262d; white-space:nowrap }
  th { color:#8b949e; font-weight:normal } td:first-child, th:first-child { text-align:left }
  .neg { color:#f85149 } .adj { color:#d29922 } .muted { color:#8b949e }
  .flag { border:1px solid #30363d; border-left:3px solid #d29922; border-radius:6px; padding:.5rem .8rem; margin:.4rem 0 }
  .flag.deterministic { border-left-color:#58a6ff }
  .tag { display:inline-block; font-size:11px; color:#8b949e; margin-right:.6rem }
  details { margin:.3rem 0 } summary { cursor:pointer; color:#8b949e }
  .rp { color:#f85149; font-size:11px; border:1px solid #f85149; border-radius:4px; padding:0 .3rem; margin-left:.4rem }
  #status { color:#8b949e; margin-left:1rem }
</style>
</head>
<body>
<h1>Reality Ledger <span class="muted">— scratch viewer</span></h1>
<p>
  <input id="cik" value="0001375365" size="12" title="10-digit CIK">
  <button onclick="load()">Load</button>
  <span id="status"></span>
</p>
<div id="out"></div>
<script>
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h; return d }
const fmt = (n, cur) => n == null ? "—" :
  (Math.abs(n) >= 1e9 ? (n/1e9).toFixed(2) + "B" : Math.abs(n) >= 1e6 ? (n/1e6).toFixed(1) + "M" :
   Math.abs(n) >= 1e3 ? (n/1e3).toFixed(0) + "K" : String(n))
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))

async function load() {
  const cik = document.getElementById("cik").value.trim()
  const status = document.getElementById("status")
  const out = document.getElementById("out")
  out.innerHTML = ""; status.textContent = "loading…"
  const res = await fetch(`/api/reality/${cik}`)
  if (!res.ok) { status.textContent = `HTTP ${res.status}`; return }
  const data = await res.json()
  status.textContent = data.company ? `${data.company.ticker} — ${data.company.name}` : "unknown company"

  // ── quarterly statements: draft vs adjusted ──
  const rows = data.statements.map(s => {
    const d = s.draft, a = s.adjusted
    const cell = (dv, av) => {
      const changed = dv !== av
      return `<td>${fmt(dv)}${changed ? ` <span class="adj">→ ${fmt(av)}</span>` : ""}</td>`
    }
    return `<tr><td>${esc(s.fiscal_label)} <span class="muted">${esc(s.period_end)}${d.q4_derived ? " (Q4 derived)" : ""}</span></td>` +
      cell(d.revenue, a.revenue) + cell(d.expenses, a.expenses) + `<td>${fmt(d.net_income)}</td>` +
      cell(d.conditional_deferred, a.conditional_deferred) + `<td>${fmt(d.backlog_rpo)}</td>` +
      cell(d.committed_balance, a.committed_balance) +
      `<td class="muted">${(s.adjustments || []).length || ""}</td></tr>` +
      ((s.adjustments || []).length || s.narrative ? `<tr><td colspan="8" class="muted" style="text-align:left;white-space:normal">` +
        (s.adjustments || []).map(x => `<div class="adj">• ${esc(x.action)} ${fmt(x.amount)} — ${esc(x.rationale)}</div>`).join("") +
        (s.narrative && s.narrative !== "No reconciliation notes for this quarter." ? `<div>${esc(s.narrative)}</div>` : "") +
        `</td></tr>` : "")
  }).join("")
  out.appendChild($(`<h2>Quarterly reality statements <span class="muted">(${data.statements[0]?.currency ?? ""}; draft <span class="adj">→ adjusted</span> where they differ)</span></h2>
    <table><tr><th>Quarter</th><th>Revenue</th><th>Expenses</th><th>Net</th><th>Deferred (cond.)</th><th>Backlog/RPO</th><th>Committed</th><th>Adj</th></tr>${rows}</table>`))

  // ── forward obligations schedule ──
  const now = new Date()
  const nowQ = `${now.getFullYear()}-Q${Math.ceil((now.getMonth() + 1) / 3)}`
  const fwd = (data.forward_schedule || []).filter(b => b.period >= nowQ)
  const fwdRows = fwd.map(b => {
    const kinds = Object.entries(b.total_by_kind).map(([k, v]) =>
      `${k === "financing" ? '<span class="muted">' : ""}${k}: ${fmt(v)}${k === "financing" ? "</span>" : ""}`).join(" · ")
    return `<tr><td style="text-align:left">${esc(b.period)}</td><td style="text-align:left">${kinds}</td>` +
      `<td style="text-align:left;white-space:normal" class="muted">${b.items.map(i => `${fmt(i.amount)} ${esc(i.unit)} due ${esc(i.due_date)}${i.notes ? " — " + esc(i.notes) : ""}`).join("<br>")}</td></tr>`
  }).join("")
  out.appendChild($(`<h2>Obligations ahead <span class="muted">(by due quarter; filed schedules spread across their disclosed windows, remaining lumps straight-lined — totals mix both, see the API's disclosed/estimated split)</span></h2>` +
    (fwd.length ? `<table><tr><th>Due</th><th>Totals</th><th>Items</th></tr>${fwdRows}</table>` : '<p class="muted">none dated</p>')))

  // ── flags ──
  const flags = data.flags.map(f =>
    `<div class="flag ${esc(f.origin)}"><span class="tag">${esc(f.flag_type)} · ${esc(f.origin)}${f.period_end ? " · " + esc(f.period_end) : ""}</span>
     ${esc(f.summary)}${f.detail ? `<details><summary>detail</summary>${esc(f.detail)}</details>` : ""}</div>`).join("")
  out.appendChild($(`<h2>Investigator flags (${data.flags.length})</h2>${flags || '<p class="muted">none</p>'}`))

  // ── entries drill-down ──
  const soft = data.entries.filter(e => e.origin === "ai")
  const softRows = soft.map(e =>
    `<tr><td style="text-align:left">${esc(e.period_end)}</td><td>${fmt(e.amount)} ${esc(e.unit)}</td>` +
    `<td style="text-align:left">${esc(e.kind)}/${esc(e.certainty)}${e.related_party ? '<span class="rp">related party</span>' : ""}</td>` +
    `<td style="text-align:left">${esc(e.due_date ?? "")}${e.inferred_due ? " (inf)" : ""}</td>` +
    `<td style="text-align:left;white-space:normal">${esc(e.notes ?? "")} <span class="muted">— ${esc(e.source_location)}</span></td></tr>`).join("")
  out.appendChild($(`<h2>Soft-layer entries (${soft.length})</h2>
    <table><tr><th>Period</th><th>Amount</th><th>Kind</th><th>Due</th><th>Notes</th></tr>${softRows}</table>
    <details><summary>${data.entries.length - soft.length} mechanical XBRL entries (raw)</summary>
    <pre>${esc(JSON.stringify(data.entries.filter(e => e.origin === "xbrl").slice(0, 200), null, 1))}</pre></details>`))
}
load()
</script>
</body>
</html>
